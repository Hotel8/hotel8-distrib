[package]
name = "hotel8-distrib"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hotel8/hotel8-distrib"
rust-version = "1.85"
description = "Sentin8 Hotel8:Distrib — Distribution service."

[[bin]]
name = "hotel8-distrib"
path = "src/main.rs"

[lib]
name = "hotel8_distrib_server"
path = "src/lib.rs"

[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency; carries the
# entire shared library workspace behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.6" }
# hotel8 namespace facade pin - carries this vertical's contracts/clients.
hotel8 = { git = "https://github.com/Hotel8/hotel8-sdk", tag = "hotel8-v0.5.6" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider", "stream"], default-features = false }
rustls = { version = "0.23", features = ["std", "tls12", "logging"], default-features = false }
rustls-graviola = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
futures-util = "0.3"
utoipa = { version = "5", features = ["chrono", "uuid"] }
